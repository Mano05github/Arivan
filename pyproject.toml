[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arivan-engine"
dynamic = ["version"]
description = "Arivan — a CPU-first, low-memory coding-agent runtime"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    {name = "Arivan contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
convert = [
    "numpy",
    "huggingface_hub",
]
oracle = [
    "torch>=2.0",
    "transformers>=4.40",
    "safetensors",
]
bench = [
    "tokenizers",
    "datasets",
]

[project.scripts]
arivan = "arivan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "arivan._version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["arivan*"]
